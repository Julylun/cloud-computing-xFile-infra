services:
  traefik:
    image: traefik:v3.3
    container_name: xfile-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/acme.json:/letsencrypt/acme.json
    networks:
      - proxy_net
    labels:
      - "traefik.enable=true"
      # Secure Traefik API/Dashboard router (optional, disabled by default)
      - "traefik.http.routers.traefik.rule=Host(`traefik.julylun.io.vn`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/julylun/cloud-computing-xfile-backend}:${BACKEND_TAG:-latest}
    container_name: xfile-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - MAIL_FROM=${MAIL_FROM:-"xFile <no-reply@julylun.io.vn>"}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api-xFile.julylun.io.vn`) || Host(`api-xfile.julylun.io.vn`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"
      - "traefik.http.routers.backend.middlewares=backend-compress,backend-headers"
      - "traefik.http.middlewares.backend-compress.compress=true"
      - "traefik.http.middlewares.backend-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/julylun/cloud-computing-xfile-frontend}:${FRONTEND_TAG:-latest}
    container_name: xfile-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api-xfile.julylun.io.vn}
    networks:
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`xFile.julylun.io.vn`) || Host(`xfile.julylun.io.vn`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.frontend.middlewares=frontend-compress"
      - "traefik.http.middlewares.frontend-compress.compress=true"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  proxy_net:
    name: proxy_net
    driver: bridge

volumes:
  backend_uploads:
    name: xfile_backend_uploads
